<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seven Circles</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0505; }
      #app { width: 100%; height: 100%; position: relative; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        font-family: "Courier New", Courier, monospace;
        color: #e8c070;
        text-shadow: 0 0 4px #000, 1px 1px 0 #000;
        z-index: 10;
      }
      #hud-title {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 18px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #hud-weapons {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 24px;
        font-size: 14px;
      }
      #hud-weapons .slot {
        padding: 6px 14px;
        border: 1px solid #8b4513;
        background: rgba(20, 8, 8, 0.7);
        color: #e8c070;
      }
      #hud-weapons .slot.active {
        border-color: #fff0c0;
        color: #fff0c0;
        background: rgba(60, 20, 10, 0.85);
      }
      #hud-ammo {
        position: absolute;
        bottom: 76px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 20px;
        letter-spacing: 0.14em;
      }
      #hud-hint {
        position: absolute;
        bottom: 108px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        color: #a08060;
        opacity: 0.85;
      }
      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 10px;
        height: 10px;
        transform: translate(-50%, -50%);
      }
      #crosshair::before,
      #crosshair::after {
        content: "";
        position: absolute;
        background: #e8c070;
      }
      #crosshair::before { left: 4px; top: 0; width: 2px; height: 10px; }
      #crosshair::after { left: 0; top: 4px; width: 10px; height: 2px; }
      #settings-gear,
      #settings-panel { pointer-events: auto; }
      #settings-gear {
        position: absolute;
        top: 16px;
        right: 16px;
        padding: 6px 10px;
        font: inherit;
        color: #e8c070;
        background: rgba(20, 8, 8, 0.75);
        border: 1px solid #8b4513;
        cursor: pointer;
      }
      #settings-panel[hidden] { display: none; }
      #settings-panel {
        position: absolute;
        top: 52px;
        right: 16px;
        width: 220px;
        padding: 12px;
        background: rgba(12, 6, 6, 0.94);
        border: 1px solid #8b4513;
        color: #e8c070;
        font-size: 13px;
      }
      #settings-panel label { display: block; margin-bottom: 8px; }
      #settings-panel input[type="range"] { width: 100%; cursor: pointer; }
      #settings-note { margin-top: 8px; color: #a08060; font-size: 11px; }
      #perk-list {
        position: absolute;
        top: 64px;
        left: 16px;
        width: 250px;
        font-size: 13px;
      }
      #perk-list .perk-heading {
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 8px;
        font-size: 12px;
      }
      #perk-list .perk { margin-bottom: 8px; }
      #perk-list .perk-name { color: #e8c070; }
      #perk-list .perk.hot .perk-name { color: #fff6d0; }
      #perk-list .perk-desc { color: #a08060; font-size: 11px; }
      #perk-toast[hidden] { display: none; }
      #perk-toast {
        position: absolute;
        left: 50%;
        top: 40%;
        transform: translateX(-50%);
        font-size: 22px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #fff6d0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div id="crosshair"></div>
        <div id="hud-title">Seven Circles V0 — Floor 1</div>
        <div id="hud-hint">Click to aim · WASD · Space jump · Ctrl/C crouch · Shift dash · 1/2/3 · LMB · R · Esc aim</div>
        <div id="hud-ammo"></div>
        <div id="hud-weapons">
          <div class="slot" id="slot-primary">[1] Primary</div>
          <div class="slot" id="slot-secondary">[2] Secondary</div>
          <div class="slot" id="slot-melee">[3] Melee</div>
        </div>
        <div id="perk-list"></div>
        <div id="perk-toast" hidden></div>
        <button id="settings-gear" type="button">Aim</button>
        <div id="settings-panel" hidden>
          <label for="aim-sens">Aim sensitivity <span id="sens-readout">1.00</span></label>
          <input id="aim-sens" type="range" min="0.2" max="2.5" step="0.05" value="1" />
          <div id="settings-note">Esc opens this. Click the view to look again.</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
