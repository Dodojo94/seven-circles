<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seven Circles</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0505; }
      #app { width: 100%; height: 100%; position: relative; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        font-family: "Courier New", Courier, monospace;
        color: #e8c070;
        text-shadow: 0 0 4px #000, 1px 1px 0 #000;
        z-index: 10;
      }
      #hud-title {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 18px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #hud-weapons {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 24px;
        font-size: 14px;
      }
      #hud-weapons .slot {
        padding: 6px 14px;
        border: 1px solid #8b4513;
        background: rgba(20, 8, 8, 0.7);
      }
      #hud-hint {
        position: absolute;
        bottom: 72px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        color: #a08060;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div id="hud-title">Seven Circles V0 — Floor 1</div>
        <div id="hud-hint">Click to lock pointer · WASD move · Space jump · C crouch · 1/2/3 weapons</div>
        <div id="hud-weapons">
          <div class="slot" id="slot-primary">[1] Primary</div>
          <div class="slot" id="slot-secondary">[2] Secondary</div>
          <div class="slot" id="slot-melee">[3] Melee</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
